name: Build and release

# Every push to master builds the solution (Release) as a check.
# Pushing a tag like v1.2.0 additionally publishes a GitHub Release with the
# installer (CarveMaker-Setup-<version>.exe) attached, so users can install
# without building. Bump <Version> in Directory.Build.props to match the tag.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CarveMaker.sln

      - name: Build (Release) and create installer
        run: dotnet build CarveMaker.sln -c Release --no-restore

      - name: Installer produced
        shell: pwsh
        run: Get-ChildItem CarveMaker-Setup-*.exe | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarveMaker-installer
          path: CarveMaker-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CarveMaker ${{ github.ref_name }}
          files: CarveMaker-Setup-*.exe
          generate_release_notes: true
